<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hybrid Onboarding Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#0f2a24;--mute:#5b7069;--line:#d3dfda;--g:#128c5a;--gd:#0b6b43;--amb:#fff4d6;--ambl:#e8a317;--red:#c23b3b;--redbg:#fdecec;--ai:#eaf6f0;--hum:#1d2b53;--code:#f3f6f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a16;--card:#14251f;--ink:#e6f2ee;--mute:#93aaa2;--line:#27413a;--g:#2fbf86;--gd:#59d8a6;--amb:#3a3112;--red:#ff8a8a;--redbg:#3a1a1a;--ai:#173329;--hum:#33417a;--code:#0f1e19}}
:root[data-theme="dark"]{--bg:#0d1a16;--card:#14251f;--ink:#e6f2ee;--mute:#93aaa2;--line:#27413a;--g:#2fbf86;--gd:#59d8a6;--amb:#3a3112;--red:#ff8a8a;--redbg:#3a1a1a;--ai:#173329;--hum:#33417a;--code:#0f1e19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;max-width:980px;margin:auto}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em}.logo i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--g);margin-right:8px}
main{max-width:720px;margin:8px auto 120px;padding:0 20px}
h1{font-size:28px;letter-spacing:-.03em;margin:8px 0 4px;font-weight:800}p.sub{color:var(--mute);margin:0 0 20px}
.steps{display:flex;gap:8px;margin-bottom:18px}.st{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:700;font-size:13px}
.st b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);margin-right:8px;font-size:12px}
.st.on{border-color:var(--g);color:var(--ink)}.st.on b{background:var(--g);color:#fff}.st.done b{background:var(--gd);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.pri{background:var(--g);color:#fff}.pri:hover{background:var(--gd)}.pri:disabled{opacity:.5;cursor:default}.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}.hint{color:var(--mute);font-size:13px}
.err{background:var(--redbg);border:1px solid var(--red);color:var(--red);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:13px}
.ok{background:var(--ai);border:1px solid var(--g);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:13px}
code,pre{font:12.5px/1.45 ui-monospace,Menlo,monospace}pre{background:var(--code);padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0 0}
.flash{animation:fl 1.2s}@keyframes fl{0%{background:var(--amb)}100%{background:var(--bg)}}
.nodes{display:flex;flex-direction:column;gap:8px;margin-top:12px}.node{border:1px solid var(--line);border-left:4px solid var(--g);border-radius:8px;padding:8px 12px;background:var(--bg);font-size:13px}.node small{color:var(--mute);display:block}
.ctl{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;max-width:230px;z-index:5}
.ctl summary{cursor:pointer;font-weight:700}.ctl button{display:block;width:100%;margin-top:6px;text-align:left;padding:6px 8px;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--g);color:#fff;border-radius:28px;padding:12px 18px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:6}
#fab.pulse{animation:pu 1s 3}@keyframes pu{50%{transform:scale(1.08)}}
#cp{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:370px;max-width:calc(100vw - 32px);height:540px;max-height:calc(100% - 40px);background:var(--card);border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;z-index:7}
#cp.open{display:flex}#cph{padding:12px 14px;background:var(--g);color:#fff;display:flex;justify-content:space-between;align-items:center}#cp.human #cph{background:var(--hum)}
#cph b{display:block}#cph small{opacity:.85}#cph button{background:rgba(255,255,255,.2);color:#fff;padding:4px 10px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px}.m.ai{background:var(--ai);align-self:flex-start}.m.hu{background:#e3e8fb;color:#16224a;align-self:flex-start}.m.me{background:var(--g);color:#fff;align-self:flex-end}.m.sys{align-self:center;background:var(--amb);font-size:12px;text-align:center;max-width:95%}
.m .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.m .acts button{padding:6px 10px;font-size:13px}
#cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}#cf input{flex:1}
@media(max-width:560px){.steps{flex-direction:column}.ctl{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><div class="logo"><i></i>Wavedesk <span class="hint" style="font-weight:500">· WhatsApp automation</span></div><span class="hint">Setup · about 5 minutes</span></header>
<main>
<h1 id="h">Connect your WhatsApp number</h1><p class="sub" id="sub">Link your WhatsApp Business API account so Wavedesk can send messages.</p>
<div class="steps" id="steps"></div>
<div class="card" id="card"></div>
</main>

<details class="ctl"><summary>Prototype controls</summary>
<button onclick="sim('idle90')">Idle on step 1 for 90 s</button>
<button onclick="sim('idle15')">Idle on a step for 15 min</button>
<button onclick="sim('500')">Trigger 500 error (save fails)</button>
<button onclick="sim('ban')">Meta suspends the account</button>
<button onclick="sim('reset')">Restart prototype</button></details>

<button id="fab" onclick="openCp(true)">✦ Ask Co-Pilot</button>
<section id="cp" aria-label="AI Co-Pilot"><div id="cph"><div><b id="cpt">Co-Pilot</b><small id="cps">AI assistant · sees this page</small></div><span><button id="rs" onclick="resolve()" style="display:none;margin-right:6px">Mark resolved</button><button onclick="openCp(false)" aria-label="Minimise">–</button></span></div>
<div id="msgs" aria-live="polite"></div>
<form id="cf" onsubmit="return send(event)"><input id="ci" placeholder="Ask or describe what you need…" autocomplete="off"><button class="pri">Send</button></form></section>

<script>
const $=id=>document.getElementById(id);
const S={step:1,connected:false,approved:false,fails:0,handoff:false,idle:0,nudged:false,tries:0,err:null,flow:null,done:false,banner:'',locked:false};
const TPL_BAD="🔥 FLASH SALE! 50% off everything this weekend only! Shop now and save big!!";
const FIX=["Hi {{1}}, your order {{2}} is confirmed and will arrive by {{3}}. Reply here if you need help with your delivery.","Hello {{1}}, an update on order {{2}}: it has shipped and is expected on {{3}}. You can track it from your account page."];
const TITLES=["Connect your WhatsApp number","Create your first message template","Launch your first flow"];
const SUBS=["Link your WhatsApp Business API account so Wavedesk can send messages.","Meta must approve every template before you can send it to customers.","Turn your approved template into a live conversation flow."];
let tplText=TPL_BAD;

function render(){
 $("h").textContent=S.done?"You're live":TITLES[S.step-1];$("sub").textContent=S.done?"Your first flow is running.":SUBS[S.step-1];
 $("steps").innerHTML=["Connect API","Create template","Launch flow"].map((t,i)=>`<div class="st ${S.step==i+1&&!S.done?'on':''} ${S.step>i+1||S.done?'done':''}"><b>${S.step>i+1||S.done?'✓':i+1}</b>${t}</div>`).join("");
 let h="";
 if(S.done)h=`<div class="ok">Flow <b>Order updates</b> is live and connected to your WhatsApp number. First message goes out when an order status changes.</div><div class="nodes">${nodeHtml()}</div>`;
 else if(S.step==1)h=`<label for="pid">Phone number ID</label><input id="pid" value="1092837465011"><label for="tok">Permanent access token</label><input id="tok" type="password" value="EAAG-demo-token-••••"><p class="hint">Find both in Meta Business Manager under WhatsApp → API setup. Business Verification must be complete.</p><div id="e1"></div><div class="row"><button class="pri" id="b1" onclick="connect()">Connect</button></div>`;
 else if(S.step==2)h=`<label for="cat">Category</label><select id="cat"><option>Utility (transactional)</option><option>Marketing</option></select><label for="tpl">Message body</label><textarea id="tpl" oninput="tplText=this.value">${esc(tplText)}</textarea><p class="hint">Use {{1}}, {{2}} for variables. Utility templates must relate to an order or account the customer already has.</p><div id="e2">${S.approved?'<div class="ok">Template approved by Meta.</div>':''}</div><div class="row">${S.approved?'<button class="pri" onclick="go(3)">Continue</button>':'<button class="pri" id="b2" onclick="submitTpl()">Submit to Meta</button>'}</div>`;
 else h=`<p>Describe the conversation you want. Try the Co-Pilot: <i>“build a flow that confirms an order and then asks for a rating”</i>.</p><div class="nodes" id="nodes">${nodeHtml()}</div><div class="row"><button class="ghost" onclick="openCp(true);ask('Build a flow that confirms an order and then asks for a rating')">Build with Co-Pilot</button><button class="pri" ${S.flow?'':'disabled'} onclick="launch()">Launch flow</button></div>`;
 $("card").innerHTML=h+(S.banner||"");
 if(S.locked)document.querySelectorAll("#card button,#card input,#card textarea,#card select").forEach(x=>x.disabled=true);
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nodeHtml(){return S.flow?S.flow.map(n=>`<div class="node"><b>${n[0]}</b><small>${n[1]}</small></div>`).join(""):'<div class="hint">No nodes yet.</div>'}
function go(n){S.step=n;S.idle=0;S.nudged=false;render();}

// ---- wizard actions
function connect(){const b=$("b1");b.disabled=true;b.textContent="Checking with Meta…";setTimeout(()=>{S.connected=true;go(2);say("ai","Connected. Next you'll write a message template. If Meta rejects it, I'll explain why and offer a fix.");},900)}
function submitTpl(){
 const t=$("tpl").value,b=$("b2");b.disabled=true;b.textContent="Waiting for Meta…";
 setTimeout(()=>{
  if(/sale|% ?off|shop now|limited|discount|!!|🔥|offer/i.test(t)){
   S.err="promotional_content";
   $("e2").innerHTML=`<div class="err"><b>Template rejected.</b><pre>{"status":"REJECTED","error":"promotional_content","code":2388023}</pre></div>`;b.disabled=false;b.textContent="Submit to Meta";
   openCp(true);
   say("ai","Meta rejected this template for <b>sounding too promotional</b>. Utility templates can only update customers about something they already did, like an order. Promotions need the Marketing category.",[["Rewrite it for me",()=>rewrite()],["Keep as marketing",()=>say("ai","Switch the category to Marketing, and keep in mind marketing templates cost more per message and need opt-in.")]]);
  }else{S.approved=true;S.fails=0;S.err=null;render();say("ai","Approved. Meta accepted the template. Continue to build your flow.");}
 },1100)}
function rewrite(){
 const t=FIX[S.tries%2];S.tries++;tplText=t;render();const ta=$("tpl");ta.classList.add("flash");$("cat").selectedIndex=0;
 say("ai",`I rewrote it in a transactional tone and kept your variables:<pre>${esc(t)}</pre>Submit it when you're ready.`,[["Looks good",()=>{S.fails=0;say("ai","Great. Hit Submit to Meta.")}],["Not what I wanted",()=>{S.fails++;if(S.fails>=2)escalate("You rejected two AI suggestions in a row");else{say("ai","Sorry about that. Here is another version.");rewrite()}}]]);
}
function launch(){S.done=true;render();say("ai","Your flow is live. Setup done.");}

// ---- chat
function say(who,html,acts){const d=document.createElement("div");d.className="m "+who;d.innerHTML=html;
 if(acts){const a=document.createElement("div");a.className="acts";acts.forEach(([l,f],i)=>{const b=document.createElement("button");b.className=i?"ghost":"pri";b.textContent=l;b.onclick=()=>{a.remove();f()};a.appendChild(b)});d.appendChild(a)}
 $("msgs").appendChild(d);$("msgs").scrollTop=1e9;if(!$("cp").classList.contains("open"))$("fab").classList.add("pulse");}
function openCp(o){$("cp").classList.toggle("open",o);$("fab").style.display=o?"none":"";$("fab").classList.remove("pulse");if(o)$("ci").focus()}
function send(e){e.preventDefault();const v=$("ci").value.trim();if(v){$("ci").value="";ask(v)}return false}
function ask(v){say("me",esc(v));S.idle=0;
 if(S.handoff){setTimeout(()=>say("hu",pick(["Thanks, I'm looking at that now.","Got it. I can see your last step and the error log.","I'll sort this out with you. One moment."])),1400);return}
 const l=v.toLowerCase();
 if(/\b(human|agent|person|representative)\b|fuck|shit|damn|bastard|stupid bot/.test(l))return escalate("You asked for a human or used flagged language");
 if(/bill|payment|charge|refund|invoice|overcharg|plan change|upgrade my plan/.test(l))return escalate("Billing or payment topic");
 if(/ban|suspend|disabled account|appeal/.test(l))return escalate("Account suspension or ban question");
 if(/python|script|custom code|erp|sap|bespoke/.test(l))return say("ai","I won't write custom code or bespoke integrations for enterprise systems. I can structure a standard webhook payload, or hand you to a human who can scope the integration.",[["Standard webhook JSON",()=>ask("give me webhook json")],["Talk to a human",()=>escalate("Custom integration request")]]);
 if(/click|business manager|shopify|do it for me in/.test(l))return say("ai","I can't act inside Facebook Business Manager or Shopify for you. Here is where to click: <b>WhatsApp Manager → Phone numbers → Add</b>. Tell me what you see and I'll help interpret it.");
 if(/json|webhook|payload/.test(l))return say("ai","A standard order-update payload:<pre>"+esc(JSON.stringify({event:"order.shipped",to:"+91XXXXXXXXXX",template:"order_update",params:["Asha","#4821","14 Oct"]},null,1))+"</pre>");
 if(/flow|node|chatbot|build/.test(l)){
  if(S.step!=3)return say("ai","Flows come in step 3. Finish your template first, then I can build one from a description.");
  S.flow=[["Trigger","Order status changes"],["Send template","order_update (approved)"],["Wait","Up to 24 hours for a reply"],["Ask rating","“How was your delivery? Reply 1–5”"],["Branch","1–3 → notify support · 4–5 → thank customer"]];
  render();return say("ai","I added 5 nodes to your canvas. Edit any of them, then press Launch flow.")}
 if(/reject|template|error|why/.test(l)&&S.err)return say("ai","Your last template failed with <code>promotional_content</code>. Want me to rewrite it?",[["Rewrite it",()=>rewrite()]]);
 say("ai","I can explain errors, rewrite rejected templates, draft webhook JSON and build simple flows. What are you trying to do on this step?");}
const pick=a=>a[Math.random()*a.length|0];

// ---- escalation
function escalate(reason,kind){
 if(S.handoff)return;S.handoff=true;openCp(true);$("cp").classList.add("human");$("cpt").textContent="Human support";$("cps").textContent="Connecting you to an agent…";
 say("sys",`<b>Handed to a human.</b> Reason: ${reason}.<br>Step ${S.step} of 3${S.err?' · last error: '+S.err:''} shared with the agent so you don't repeat yourself.`);
 $("rs").style.display="";
 setTimeout(()=>{$("cps").textContent="Priya · Support · online";say("hu","Hi, I'm Priya from Wavedesk support. I've read your session and the chat so far.")},2000);
 if(kind=="ban"){
  setTimeout(()=>say("hu","I checked your account. Meta applied a <b>temporary restriction</b> after a quality-rating drop, not a permanent ban. I'm filing the review request with Meta now. Your setup is locked until it clears."),5000);
  setTimeout(()=>say("hu","Meta reviewed it and lifted the restriction. Your number is active again."),11000);
  setTimeout(()=>resolve("Account restriction lifted by Meta"),12500)}
 if(kind=="500"){
  setTimeout(()=>say("hu","That 500 was a failed save on our side. I'm restoring your last saved progress."),5000);
  setTimeout(()=>say("hu","Done. Your progress is restored, so you can pick up where you left off."),9000);
  setTimeout(()=>resolve("Saved progress restored"),10500)}
}
function resolve(why){
 if(!S.handoff)return;S.handoff=false;S.locked=false;S.banner="";S.err=null;S.idle=0;
 $("cp").classList.remove("human");$("cpt").textContent="Co-Pilot";$("cps").textContent="AI assistant · sees this page";$("rs").style.display="none";
 render();say("sys","<b>Resolved.</b> "+(typeof why=="string"?why:"Marked resolved")+". The Co-Pilot is back and your setup is unlocked.");}
function sim(k){
 if(k=="reset")return location.reload();
 if(k=="idle90"){if(S.step!=1)go(1);return nudge()}
 if(k=="idle15")return escalate("Idle on the same step for 15+ minutes");
 if(k=="500"){const e=$("e"+S.step)||$("card");S.banner='<div class="err"><b>Couldn\'t save.</b><pre>HTTP 500 · save_state_failed</pre></div>';S.err="HTTP 500 save_state_failed";render();return escalate("Backend 500-level error","500")}
 if(k=="ban"){S.err="account_suspended (131031)";S.banner='<div class="err"><b>Account restricted by Meta. Setup is paused.</b><pre>error: 131031 account_suspended</pre>Our support team is on it.</div>';S.locked=true;render();return escalate("Meta account suspension","ban")}}
function nudge(){if(S.nudged||S.step!=1)return;S.nudged=true;openCp(true);say("ai","Stuck on Meta Business Verification? Most people get stuck on the document upload. Open <b>Business settings → Security Center → Start verification</b> and tell me which screen you're on.",[["Show me the link",()=>say("ai","Direct path: <code>business.facebook.com/settings/security</code>. Come back when it says Verified.")],["I'm fine",()=>{}]])}
setInterval(()=>{if(S.done||S.handoff)return;S.idle++;if(S.idle==90)nudge();if(S.idle==900)escalate("Idle on the same step for 15+ minutes")},1000);
["click","keydown","input"].forEach(e=>document.addEventListener(e,()=>S.idle=0));
render();setTimeout(()=>say("ai","Hi, I'm your setup Co-Pilot. I'll stay out of the way until something goes wrong."),400);
</script></body></html>
